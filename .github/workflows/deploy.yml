name: Build & Deploy Admin

# dev  branch -> https://dev.admin.kbscosmetics.com (calls the dev API)
# main branch -> https://admin.kbscosmetics.com     (calls the prod API)
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/dagic-zewdu/kbs-admin

jobs:
  check:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy:
    name: Deploy (${{ github.ref_name }})
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      APP_ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      SITE_URL: ${{ github.ref_name == 'main' && 'https://admin.kbscosmetics.com/login' || 'https://dev.admin.kbscosmetics.com/login' }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_ENV=${{ env.APP_ENV }}
          tags: |
            ${{ env.IMAGE }}:${{ env.APP_ENV }}
            ${{ env.IMAGE }}:${{ env.APP_ENV }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ env.APP_ENV }}
          cache-to: type=gha,mode=max,scope=${{ env.APP_ENV }}

      - name: Set up SSH (deploy user, key auth only)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host server\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n' "$SSH_HOST" "$SSH_USER" > ~/.ssh/config

      - name: Deploy on the server
        run: |
          APP_DIR="apps/kbs-admin-$APP_ENV"
          scp deploy/docker-compose.yml "server:$APP_DIR/docker-compose.yml"
          # The registry token only lives for this job and is logged out right after the pull
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh server "set -e
            cd $APP_DIR
            docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull admin
            docker logout ghcr.io
            docker compose up -d --remove-orphans
            docker image prune -f"

      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null "$SITE_URL"; then echo "Admin is up"; exit 0; fi
            echo "Waiting for admin... ($i)"; sleep 6
          done
          echo "Admin did not respond"; exit 1
